server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: love-trigger
  datasource:
    # 文件型持久化数据库（重启后数据保留）。如后续接入 Docker 中的 MySQL/PostgreSQL，
    # 只需替换 driver-class-name、url、username、password 四项即可，业务代码无需改动。
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/lovetrigger;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

logging:
  level:
    root: info
    com.lovetrigger: info
